<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#e2e9f9"/>
    </linearGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <filter id="psh" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
  </defs>
  <circle cx="980" cy="170" r="180" fill="#dbe6fb" opacity="0.45"/>
  <circle cx="270" cy="760" r="150" fill="#e9defb" opacity="0.4"/>

  <!-- Phone -->
  <rect x="120" y="120" width="380" height="700" rx="46" fill="#0c1838" filter="url(#psh)"/>
  <rect x="136" y="136" width="348" height="668" rx="34" fill="#f6f8fc"/>
  <rect x="136" y="136" width="348" height="92" rx="34" fill="#1D4ED8"/>
  <rect x="136" y="190" width="348" height="38" fill="#1D4ED8"/>
  <circle cx="178" cy="182" r="20" fill="#ffffff" opacity="0.25"/>
  <text x="210" y="176" fill="#ffffff" font-size="14" font-weight="700">Hola, familia 👋</text>
  <text x="210" y="196" fill="#cfe0fb" font-size="12">Progreso de Mateo</text>

  <!-- progress card -->
  <rect x="160" y="252" width="300" height="170" rx="18" fill="#ffffff"/>
  <text x="182" y="284" fill="#0b1020" font-size="13" font-weight="700">Avance semanal</text>
  <text x="420" y="284" fill="#16a34a" font-size="12" font-weight="700" text-anchor="end">+12%</text>
  <path d="M182 392 L228 372 L274 380 L320 350 L366 332 L412 306 L438 296 L438 400 L182 400 Z" fill="url(#pa)"/>
  <polyline points="182,392 228,372 274,380 320,350 366,332 412,306 438,296" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- objective row -->
  <rect x="160" y="440" width="300" height="64" rx="14" fill="#ffffff"/>
  <circle cx="192" cy="472" r="16" fill="#dcfce7"/><path d="M185 472 l5 5 l9 -10" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="468" fill="#0b1020" font-size="12.5" font-weight="600">Comunicación funcional</text>
  <text x="220" y="486" fill="#16a34a" font-size="11">Meta alcanzada · 85%</text>

  <!-- home activity -->
  <rect x="160" y="520" width="300" height="84" rx="14" fill="#eff6ff"/>
  <text x="182" y="550" fill="#1e40af" font-size="12.5" font-weight="700">🏠 Actividad para casa</text>
  <text x="182" y="572" fill="#3b5bdb" font-size="11">Juego de turnos · 10 min/día</text>
  <text x="182" y="590" fill="#3b5bdb" font-size="11">Sugerido por ARIA</text>

  <!-- message -->
  <rect x="160" y="620" width="300" height="64" rx="14" fill="#ffffff"/>
  <circle cx="192" cy="652" r="16" fill="#ede9fe"/><text x="192" y="657" fill="#7c3aed" font-size="11" font-weight="700" text-anchor="middle">LR</text>
  <text x="220" y="648" fill="#0b1020" font-size="12" font-weight="600">Lucía · Especialista</text>
  <text x="220" y="666" fill="#9aa3b5" font-size="11">¡Excelente semana de Mateo!</text>

  <!-- tab bar -->
  <rect x="136" y="730" width="348" height="74" fill="#ffffff"/>
  <circle cx="208" cy="767" r="6" fill="#1D4ED8"/><circle cx="300" cy="767" r="6" fill="#c7d0e0"/><circle cx="392" cy="767" r="6" fill="#c7d0e0"/>

  <!-- floating cards -->
  <g>
    <rect x="560" y="180" width="430" height="120" rx="18" fill="#ffffff" stroke="#e3e8f2" filter="url(#psh)"/>
    <circle cx="606" cy="240" r="22" fill="#25D366"/><path d="M597 240 a9 9 0 1 1 4 8 l-8 2 l2 -7 a9 9 0 0 1 2 -3" fill="#fff"/>
    <text x="644" y="226" fill="#0b1020" font-size="15" font-weight="700">Notificación por WhatsApp</text>
    <text x="644" y="250" fill="#5b647a" font-size="12.5">“Mateo alcanzó un nuevo objetivo 🎉”</text>
    <text x="644" y="272" fill="#9aa3b5" font-size="11">Enviado automáticamente · hoy 12:04</text>

    <rect x="600" y="330" width="470" height="150" rx="18" fill="#ffffff" stroke="#e3e8f2" filter="url(#psh)"/>
    <text x="628" y="368" fill="#0b1020" font-size="15" font-weight="700">Reporte de sesión</text>
    <text x="628" y="392" fill="#9aa3b5" font-size="12">Generado por ARIA · 8 s</text>
    <rect x="628" y="408" width="414" height="9" rx="4.5" fill="#eef1f6"/><rect x="628" y="408" width="380" height="9" rx="4.5" fill="#1D4ED8"/>
    <rect x="628" y="428" width="414" height="9" rx="4.5" fill="#eef1f6"/><rect x="628" y="428" width="300" height="9" rx="4.5" fill="#cfe0fb"/>
    <rect x="628" y="448" width="280" height="9" rx="4.5" fill="#eef1f6"/>

    <rect x="560" y="512" width="250" height="120" rx="18" fill="#0c1838"/>
    <text x="586" y="548" fill="#aab6d4" font-size="12">Próxima sesión</text>
    <text x="586" y="584" fill="#ffffff" font-size="22" font-weight="800">Mañana 09:00</text>
    <text x="586" y="610" fill="#60a5fa" font-size="12" font-weight="700">Recordatorio activo</text>

    <rect x="828" y="512" width="242" height="120" rx="18" fill="#eff6ff" stroke="#dbe6fb"/>
    <text x="852" y="548" fill="#1e40af" font-size="12">Mensajes</text>
    <text x="852" y="584" fill="#1D4ED8" font-size="22" font-weight="800">3 nuevos</text>
    <text x="852" y="610" fill="#3b5bdb" font-size="12">del equipo clínico</text>
  </g>

  <text x="560" y="700" fill="#0b1020" font-size="26" font-weight="800">Portal familiar</text>
  <text x="560" y="730" fill="#5b647a" font-size="15">Las familias, conectadas al progreso en tiempo real.</text>
</svg>
